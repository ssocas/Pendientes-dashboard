<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Santiago</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f4f5f7; color: #1a1a2e;
  padding: 16px; font-size: 14px; min-height: 100vh;
}
/* ── SETUP SCREEN ── */
.setup-overlay {
  position: fixed; inset: 0; background: #f4f5f7;
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.setup-card {
  background: #fff; border-radius: 16px; padding: 32px;
  max-width: 440px; width: 100%;
  box-shadow: 0 4px 24px rgba(0,0,0,.12);
}
.setup-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.setup-card p  { font-size: 12px; color: #6b7280; margin-bottom: 24px; line-height: 1.6; }
.setup-card label { display: block; font-size: 11px; font-weight: 700; color: #374151; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.setup-card input {
  width: 100%; padding: 9px 12px; border-radius: 8px;
  border: 1.5px solid #e5e7eb; font-size: 12px; font-family: monospace;
  margin-bottom: 14px; outline: none; transition: border-color .15s;
}
.setup-card input:focus { border-color: #6366f1; }
.setup-btn {
  width: 100%; padding: 11px; background: #1a1a2e; color: #fff;
  border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.setup-btn:hover { background: #6366f1; }
.setup-err { color: #dc2626; font-size: 11px; margin-top: 8px; display: none; }
/* ── HEADER ── */
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.header h1 { font-size: 18px; font-weight: 800; }
.header-right { text-align: right; }
.sync-info { font-size: 10px; color: #9ca3af; line-height: 1.7; }
.btn-sm {
  font-size: 24px; font-weight: 700; padding: 10px 20px;
  border-radius: 20px; border: 2px solid #e5e7eb;
  background: #fff; color: #6b7280; cursor: pointer; margin-left: 8px;
}
.btn-sm:hover { border-color: #6366f1; color: #6366f1; }
.date-sub { font-size: 11px; color: #9ca3af; margin-top: 3px; text-transform: capitalize; }
/* ── STATS ── */
.stats { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.stat { background: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); flex: 1; min-width: 70px; text-align: center; }
.stat-val { font-size: 24px; font-weight: 800; color: #1a1a2e; line-height: 1; }
.stat-lbl { font-size: 9px; color: #9ca3af; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.s-hoy    .stat-val { color: #d97706; }
.s-semana .stat-val { color: #0891b2; }
.s-crit   .stat-val { color: #dc2626; }
.s-venc   .stat-val { color: #7c3aed; }
/* ── SECTIONS ── */
.section { margin-bottom: 20px; }
.section-title {
  display: flex; align-items: center; gap: 7px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: #6b7280;
  margin-bottom: 8px; padding-bottom: 6px;
  border-bottom: 1.5px solid #e5e7eb;
}
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.badge { background: #e5e7eb; color: #6b7280; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
/* ── FILTERS ── */
.filter-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.fbtn {
  font-size: 18px; font-weight: 600; padding: 10px 20px;
  border-radius: 20px; border: 2px solid #e5e7eb;
  background: #fff; color: #6b7280; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: all .12s;
}
.fbtn:hover  { border-color: #6366f1; color: #6366f1; }
.fbtn.active { background: #6366f1; border-color: #6366f1; color: #fff; }
.fcat-dot { width: 6px; height: 6px; border-radius: 50%; }
/* ── TASK CARDS ── */
.tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; }
.task-card {
  background: #fff; border-radius: 8px; padding: 10px 12px;
  border-left: 3px solid #e5e7eb; box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.p-critica { border-left-color: #ef4444; }
.p-alta    { border-left-color: #f97316; }
.p-media   { border-left-color: #eab308; }
.p-baja    { border-left-color: #22c55e; }
.is-hoy    { background: #fffbeb; }
.is-venc   { border-left-color: #7c3aed; }
.task-top  { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.task-desc { font-size: 12.5px; font-weight: 500; color: #111827; line-height: 1.45; }
.task-controls { display: flex; gap: 2px; flex-shrink: 0; }
.toggle-btn {
  background: none; border: none; font-size: 16px; line-height: 1;
  padding: 2px 3px; cursor: pointer; opacity: .45;
  transition: opacity .12s, transform .12s;
}
.toggle-btn:hover  { opacity: 1; transform: scale(1.18); }
.toggle-btn.active { opacity: 1; }
.task-meta { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
.tag-cat    { background: #f3f4f6; color: #374151; }
.tag-status { background: #f3f4f6; color: #374151; }
.tag-venc   { background: #fff7ed; color: #c2410c; font-weight: 700; }
.tag-venc.urgent { background: #fef2f2; color: #dc2626; }
.tag-terc   { background: #eff6ff; color: #2563eb; }
.tag-id     { background: #f3f4f6; color: #9ca3af; font-size: 9px; }
.tag-select {
  font-size: 10px; font-weight: 500; padding: 2px 6px 2px 7px; border-radius: 20px;
  border: 1px solid #e5e7eb; background: #f3f4f6; color: #374151;
  cursor: pointer; outline: none; max-width: 140px;
}
.tag-select:hover  { border-color: #6366f1; }
.tag-select:focus  { border-color: #6366f1; }
/* ── QUICK ADD ── */
.quick-add { display: flex; gap: 6px; background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); flex-wrap: wrap; }
.quick-add input[type=text] { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px; border: 1.5px solid #e5e7eb; font-size: 13px; outline: none; font-family: inherit; }
.quick-add input[type=text]:focus { border-color: #6366f1; }
.quick-add select { padding: 8px 10px; border-radius: 8px; border: 1.5px solid #e5e7eb; font-size: 12px; background: #fff; color: #374151; outline: none; font-family: inherit; }
.quick-add input[type=date] { padding: 8px 10px; border-radius: 8px; border: 1.5px solid #e5e7eb; font-size: 12px; color: #374151; outline: none; font-family: inherit; }
.quick-add button { padding: 8px 16px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.quick-add button:hover    { background: #4f46e5; }
.quick-add button:disabled { background: #c7c7d1; cursor: default; }
/* ── EDIT PANEL ── */
.edit-panel { margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0efeb; display: flex; flex-direction: column; gap: 6px; }
.edit-panel input, .edit-panel select, .edit-panel textarea {
  width: 100%; padding: 7px 9px; border-radius: 7px; border: 1.5px solid #e5e7eb;
  font-size: 12px; font-family: inherit; outline: none; color: #1a1a2e; background: #fff;
}
.edit-panel input:focus, .edit-panel select:focus, .edit-panel textarea:focus { border-color: #6366f1; }
.edit-panel textarea { resize: vertical; min-height: 44px; }
.edit-row { display: flex; gap: 6px; }
.edit-row > * { flex: 1; }
/* ── CALENDAR ── */
.cal-day { margin-bottom: 12px; }
.cal-day-header { font-size: 10px; font-weight: 800; color: #6366f1; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.cal-event { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 8px; padding: 8px 12px; margin-bottom: 4px; border-left: 3px solid #6366f1; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.cal-time   { font-size: 11px; font-weight: 700; color: #6366f1; min-width: 46px; flex-shrink: 0; }
.cal-allday { font-size: 10px; color: #9ca3af; font-style: italic; min-width: 46px; flex-shrink: 0; }
.cal-title  { font-size: 12.5px; color: #111827; }
/* ── TABS ── */
.tab-bar {
  display: flex; gap: 4px; margin-bottom: 16px;
  background: #e5e7eb; border-radius: 10px; padding: 4px;
}
.tab-btn {
  flex: 1; padding: 9px 12px; border: none; border-radius: 7px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: transparent; color: #6b7280; transition: all .15s;
}
.tab-btn.active { background: #fff; color: #1a1a2e; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.tab-btn:hover:not(.active) { color: #1a1a2e; }
/* ── CAJA STYLES ── */
.metrics-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 16px;
}
@media (max-width: 480px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }
.metric-card { background: #fff; border-radius: 10px; border: 0.5px solid #e5e7eb; padding: 14px 16px; }
.metric-card .label { font-size: 11px; color: #888; margin-bottom: 6px; line-height: 1.4; }
.metric-card .value { font-size: 20px; font-weight: 600; line-height: 1.1; }
.metric-card .sub { font-size: 10px; color: #aaa; margin-top: 4px; }
.metric-card.placeholder { background: transparent; border: none; }
.metric-card.hero { grid-column: 1 / -1; background: #1a1a2e; border: none; }
.metric-card.hero .label { color: #b9bdd4; }
.metric-card.hero .value { color: #fff; font-size: 26px; }
.metric-card.hero .sub { color: #8b90ad; }
.value.red   { color: #b83232; }
.value.amber { color: #8a5000; }
.value.green { color: #2a6e2a; }
.caja-card { background: #fff; border-radius: 10px; border: 0.5px solid #e5e7eb; padding: 16px; margin-bottom: 16px; }
.balance-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
@media (max-width: 560px) { .balance-cols { grid-template-columns: 1fr; } }
.caja-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.caja-table thead th { font-size: 11px; font-weight: 500; color: #999; text-align: right; padding: 0 0 8px; border-bottom: 0.5px solid #ebebeb; }
.caja-table thead th:first-child { text-align: left; }
.caja-table tbody tr { border-bottom: 0.5px solid #f0efeb; }
.caja-table tbody tr:last-child { border-bottom: none; }
.caja-table tbody td { padding: 7px 0; text-align: right; }
.caja-table tbody td:first-child { text-align: left; color: #444; }
.caja-table tbody tr.bold td { font-weight: 700; color: #1a1a2e; border-top: 0.5px solid #d0cfcc; }
.caja-table tfoot td { padding: 9px 0 0; font-weight: 600; text-align: right; border-top: 0.5px solid #d0cfcc; }
.caja-table tfoot td:first-child { text-align: left; }
.neg { color: #b83232; }
.muted { color: #bbb; }
.chart-wrap { position: relative; height: 220px; margin-top: 12px; }
.chart-wrap.tall { height: 300px; }
.caja-alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.alert { border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.5; }
.alert.danger  { background: #fdf0f0; color: #9b2020; border: 0.5px solid #f5c6c6; }
.alert.warning { background: #fdf6e8; color: #7a4500; border: 0.5px solid #f0d898; }
.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #6b7280; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1.5px solid #e5e7eb; }
.caja-meta { font-size: 11px; color: #9ca3af; margin-bottom: 16px; }
/* ── STATES ── */
.empty   { color: #9ca3af; font-size: 12px; font-style: italic; padding: 6px 0; }
.loading { text-align: center; color: #9ca3af; padding: 50px 0; font-size: 13px; }
.err-box { background: #fef2f2; color: #dc2626; border-radius: 8px; padding: 12px; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<!-- Setup screen -->
<div class="setup-overlay" id="setup" style="display:none">
  <div class="setup-card">
    <h2>📊 Dashboard — Configuración</h2>
    <p>Primera vez o nueva configuración. Ingresá la URL y el token del Apps Script para conectar con tus tareas.</p>
    <label>URL del Apps Script</label>
    <input id="cfg-url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Token secreto</label>
    <input id="cfg-token" type="password" placeholder="Tu token">
    <button class="setup-btn" onclick="saveConfig()">Conectar</button>
    <div class="setup-err" id="cfg-err"></div>
  </div>
</div>
<!-- Main -->
<div id="main" style="display:none">
  <div class="header">
    <div>
      <h1>📊 Dashboard</h1>
      <div class="date-sub" id="date-line"></div>
    </div>
    <div class="header-right">
      <div class="sync-info" id="sync-info">Cargando...</div>
      <button class="btn-sm" onclick="refreshActive()" title="Actualizar">↻</button>
      <button class="btn-sm" onclick="showSetup()" title="Cambiar configuración">⚙</button>
    </div>
  </div>
  <!-- Tabs -->
  <div class="tab-bar">
    <button id="tab-pendientes" class="tab-btn active" onclick="switchTab('pendientes')">📋 Pendientes</button>
    <button id="tab-caja"       class="tab-btn"        onclick="switchTab('caja')">💰 Caja</button>
  </div>
  <!-- Pendientes view -->
  <div id="view-pendientes">
    <div id="app"><div class="loading">⏳ Cargando...</div></div>
  </div>
  <!-- Caja view -->
  <div id="view-caja" style="display:none">
    <div id="caja-app"><div class="loading">⏳ Cargando caja...</div></div>
  </div>
</div>
<script>
// ── CONFIG ────────────────────────────────────────────────────
const CFG_KEY = 'pendientes_cfg';
let CFG = null;
let activeTab = 'pendientes';
let cajaLoaded = false;
let cajaCharts = {};
function loadConfig() {
  try { CFG = JSON.parse(localStorage.getItem(CFG_KEY)); } catch(e) { CFG = null; }
  return CFG && CFG.url && CFG.token;
}
function saveConfig() {
  const url   = document.getElementById('cfg-url').value.trim();
  const token = document.getElementById('cfg-token').value.trim();
  const err   = document.getElementById('cfg-err');
  if (!url || !token) { err.textContent = 'Completá ambos campos.'; err.style.display='block'; return; }
  CFG = { url, token };
  localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
  err.style.display = 'none';
  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display  = 'block';
  loadData();
}
function showSetup() {
  if (CFG) {
    document.getElementById('cfg-url').value   = CFG.url;
    document.getElementById('cfg-token').value = CFG.token;
  }
  document.getElementById('main').style.display  = 'none';
  document.getElementById('setup').style.display = 'flex';
}
// ── TABS ──────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-pendientes').className = 'tab-btn' + (tab === 'pendientes' ? ' active' : '');
  document.getElementById('tab-caja').className       = 'tab-btn' + (tab === 'caja'       ? ' active' : '');
  document.getElementById('view-pendientes').style.display = tab === 'pendientes' ? 'block' : 'none';
  document.getElementById('view-caja').style.display       = tab === 'caja'       ? 'block' : 'none';
  if (tab === 'caja' && !cajaLoaded) loadCaja();
}
function refreshActive() {
  if (activeTab === 'pendientes') {
    loadData();
  } else {
    cajaLoaded = false;
    loadCaja();
  }
}
// ── INIT ──────────────────────────────────────────────────────
const CAT_COLORS = {
  'Estudio Trivelloni':      '#1565C0',
  'Conceptual Brasil':       '#00897B',
  'Inversiones Financieras': '#7B1FA2',
  'Inversiones Real Estate': '#1A237E',
  'Campo':                   '#558B2F',
  'Finanzas Personales':     '#F57F17',
  'Casa y Autos':            '#4E342E',
  'Otros':                   '#546E7A',
};
const CAT_ORDER = Object.keys(CAT_COLORS);
let ALL_TASKS = [], CAL_EVENTS = [], activeCat = 'Todas', editingId = null;
const PRIO_OPTIONS   = ['🔴 Crítica', '🟠 Alta', '🟡 Media', '🟢 Baja'];
const STATUS_OPTIONS = ['🆕 Nuevo', '🔄 Comenzado', '👁 Seguimiento', '📌 Largo Plazo', '✅ Terminado'];
document.getElementById('date-line').textContent =
  new Date().toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
// ── NORMALIZE ─────────────────────────────────────────────────
function normPrio(r) {
  if (!r) return '';
  if (r.includes('rítica') || r.includes('ritica')) return '🔴 Crítica';
  if (r.includes('Alta'))   return '🟠 Alta';
  if (r.includes('Media'))  return '🟡 Media';
  if (r.includes('Baja'))   return '🟢 Baja';
  return r;
}
function normStatus(r) {
  if (!r) return '';
  if (r.includes('Terminado'))   return '✅ Terminado';
  if (r.includes('Comenzado'))   return '🔄 Comenzado';
  if (r.includes('Seguimiento')) return '👁 Seguimiento';
  if (r.includes('Largo'))       return '📌 Largo Plazo';
  if (r.includes('Nuevo'))       return '🆕 Nuevo';
  return r;
}
// ── DATE UTILS ────────────────────────────────────────────────
function daysFrom(dateStr) {
  if (!dateStr) return null;
  const [y,m,d] = dateStr.slice(0,10).split('-').map(Number);
  const target = new Date(y, m-1, d);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target - now) / 864e5);
}
function labelDays(diff) {
  if (diff === null) return '';
  if (diff === 0)  return 'Hoy';
  if (diff === 1)  return 'Mañana';
  if (diff < 0)   return `Vencida hace ${Math.abs(diff)}d`;
  return `en ${diff}d`;
}
function dayLabel(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt   = new Date(y, m-1, d);
  const now  = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((dt - now) / 864e5);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Mañana';
  return dt.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'short'});
}
// ── RENDER ────────────────────────────────────────────────────
function prioCls(p) {
  if (!p) return '';
  if (p.includes('rítica')) return 'p-critica';
  if (p.includes('Alta'))   return 'p-alta';
  if (p.includes('Media'))  return 'p-media';
  if (p.includes('Baja'))   return 'p-baja';
  return '';
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function prioSelect(t) {
  const opts = PRIO_OPTIONS.map(o =>
    `<option value="${esc(o)}"${o===t.prio?' selected':''}>${esc(o)}</option>`).join('');
  return `<select class="tag-select" onclick="event.stopPropagation()" onchange="event.stopPropagation();changePrio(${t.id}, this.value)">${opts}</select>`;
}
function statusSelect(t) {
  const opts = STATUS_OPTIONS.map(o =>
    `<option value="${esc(o)}"${o===t.status?' selected':''}>${esc(o)}</option>`).join('');
  return `<select class="tag-select" onclick="event.stopPropagation()" onchange="event.stopPropagation();changeStatus(${t.id}, this.value)">${opts}</select>`;
}
function renderTask(t, extra='', controls=[]) {
  const isHoy = t.hoy === '⭐';
  let vTag = '';
  if (t.venc) {
    const diff = daysFrom(t.venc);
    const urg  = diff !== null && diff <= 2;
    vTag = `<span class="tag tag-venc${urg?' urgent':''}" title="${esc(t.venc)}">⏰ ${labelDays(diff)}</span>`;
  }
  const cColor  = CAT_COLORS[t.cat] || '#666';
  const tercTag = t.tercero ? `<span class="tag tag-terc">👤 ${esc(t.tercero)}</span>` : '';
  let controlsHtml = '';
  if (controls.includes('star')) {
    const active = t.hoy === '⭐';
    controlsHtml += `<button class="toggle-btn${active?' active':''}" onclick="event.stopPropagation();toggleHoy(${t.id})" title="${active?'Quitar de Hoy':'Marcar para Hoy'}">${active?'⭐':'☆'}</button>`;
  }
  if (controls.includes('bookmark')) {
    const active = t.semana === '✅';
    controlsHtml += `<button class="toggle-btn${active?' active':''}" onclick="event.stopPropagation();toggleSemana(${t.id})" title="${active?'Quitar del radar semanal':'Agregar al radar semanal'}">${active?'🔖':'📑'}</button>`;
  }
  if (controls.includes('edit')) {
    const open = editingId === t.id;

  }

  const editPanel = editingId === t.id ? `
    <div class="edit-panel">
      <input type="text" value="${esc(t.desc)}" placeholder="Descripción"

  return `<div class="task-card ${prioCls(t.prio)}${isHoy?' is-hoy':''}${extra}">

      ${prioSelect(t)}

      <span class="tag tag-id">#${t.id}</span>
    </div>
    ${editPanel}

}
function renderCalendar(events) {
  if (!events || !events.length) return '<div class="empty">Sin eventos en los próximos 7 días.</div>';
  const byDate = {};
  events.forEach(e => { (byDate[e.date] = byDate[e.date]||[]).push(e); });
  return Object.keys(byDate).sort().map(date => {
    const evs = byDate[date].map(e =>
      `<div class="cal-event">
        ${e.time ? `<span class="cal-time">🕐 ${e.time}</span>` : `<span class="cal-allday">Todo el día</span>`}
        <span class="cal-title">${esc(e.title)}</span>
      </div>`).join('');
    return `<div class="cal-day">
      <div class="cal-day-header">📅 ${dayLabel(date)}</div>${evs}
    </div>`;
  }).join('');
}
function buildFilterBar(tasks) {
  const used = CAT_ORDER.filter(c => tasks.some(t => t.cat === c));

    const cnt = c === 'Todas' ? tasks.length : tasks.filter(t => t.cat === c).length;
    const col = c === 'Todas' ? '#6366f1' : (CAT_COLORS[c]||'#666');
    const dot = c === 'Todas' ? '' : `<span class="fcat-dot" style="background:${col}"></span>`;
    return `<button class="fbtn${c===activeCat?' active':''}" onclick="setFilter('${esc(c)}')">${dot}${esc(c)} (${cnt})</button>`;
  }).join('');
}
function setFilter(cat) { activeCat = cat; renderAll(); }
function renderAll() {

  </div>`;
  html += `<div class="quick-add">
    <input type="text" id="qa-desc" placeholder="Nueva tarea..." onkeydown="if(event.key==='Enter'){event.preventDefault();quickAdd();}">

    <select id="qa-prio">${PRIO_OPTIONS.map(o => `<option value="${esc(o)}"${o==='🟡 Media'?' selected':''}>${esc(o)}</option>`).join('')}</select>

  html += `<div class="section">
    <div class="section-title"><span class="dot" style="background:#d97706"></span>Tareas de hoy<span class="badge">${hoy.length}</span></div>
    ${hoy.length ? hoy.map(t=>renderTask(t,'',['star','bookmark','edit'])).join('') : '<div class="empty">Sin tareas marcadas para hoy. Usá ⭐ en el radar de la semana para agregar.</div>'}
  </div>`;
  html += `<div class="section">
    <div class="section-title"><span class="dot" style="background:#22c55e"></span>Radar de la semana<span class="badge">${semanaOnly.length}</span></div>
    ${semanaOnly.length ? semanaOnly.map(t=>renderTask(t,'',['star','bookmark','edit'])).join('') : '<div class="empty">Sin tareas en el radar semanal (fuera de las ya marcadas para hoy).</div>'}
  </div>`;
  html += `<div class="section">
    <div class="section-title"><span class="dot" style="background:#7c3aed"></span>Vencen en los próximos 7 días<span class="badge">${vencen.length}</span></div>

// ── ESCRITURA (toggles Hoy / Semana desde el dashboard) ─────────
async function postChange(id, fields) {
  const { url, token } = CFG;
  const payload = { token, action: 'apply_changes', changes: [{ op: 'update', id, fields }] };
  try {
    const res  = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return true;
  } catch (err) {
    alert('No se pudo guardar el cambio: ' + err.message);
    return false;
  }
}
function toggleHoy(id) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  if (t.hoy !== '⭐' && t.semana !== '✅') {
    alert('Esta tarea no está en el radar de la semana. Agregala primero con 📑 antes de marcarla para hoy.');
    return;
  }
  const prevHoy = t.hoy;
  const newVal  = prevHoy === '⭐' ? '☆' : '⭐';
  t.hoy = newVal; // optimista
  renderAll();
  postChange(id, { hoy: newVal }).then(ok => {
    if (!ok) { t.hoy = prevHoy; renderAll(); }
  });
}
function toggleSemana(id) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const prevSemana = t.semana, prevHoy = t.hoy;
  const newVal = prevSemana === '✅' ? '—' : '✅';
  t.semana = newVal;
  if (newVal !== '✅') t.hoy = '☆';
  renderAll();
  postChange(id, { semana: newVal }).then(ok => {
    if (!ok) { t.semana = prevSemana; t.hoy = prevHoy; renderAll(); }
  });
}
function changePrio(id, val) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const prev = t.prio;
  t.prio = val; // optimista
  renderAll();
  postChange(id, { prio: val }).then(ok => {
    if (!ok) { t.prio = prev; renderAll(); }
  });
}
function toggleEdit(id) {
  editingId = (editingId === id) ? null : id;
  renderAll();
}
function saveField(id, field, value) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const prev = t[field];
  if (prev === value) return;
  t[field] = value; // optimista
  renderAll();
  postChange(id, { [field]: value }).then(ok => {
    if (!ok) { t[field] = prev; renderAll(); }
  });
}
async function postAdd(fields) {
  const { url, token } = CFG;
  const payload = { token, action: 'apply_changes', changes: [{ op: 'add', fields }] };
  try {
    const res  = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return true;
  } catch (err) {
    alert('No se pudo crear la tarea: ' + err.message);
    return false;
  }
}
async function quickAdd() {
  const descEl = document.getElementById('qa-desc');
  const desc   = descEl.value.trim();
  if (!desc) { descEl.focus(); return; }
  const cat  = document.getElementById('qa-cat').value;
  const prio = document.getElementById('qa-prio').value;
  const venc = document.getElementById('qa-venc').value;
  const btn  = document.getElementById('qa-btn');
  const fields = { desc, cat, prio, semana: '✅', hoy: '⭐' };
  if (venc) fields.venc = venc;
  btn.disabled = true; btn.textContent = 'Agregando...';
  const ok = await postAdd(fields);
  if (ok) {
    await loadData();
  } else {
    btn.disabled = false; btn.textContent = '+ Agregar';
  }
}
function changeStatus(id, val) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  if (val === '✅ Terminado') {
    if (!confirm(`¿Marcar "${t.desc}" como Terminado?\n\nSe archivará y dejará de aparecer en Pendientes.`)) {
      renderAll();
      return;
    }
    closeTask(id);
    return;
  }
  const prev = t.status;
  t.status = val; // optimista
  renderAll();
  postChange(id, { status: val }).then(ok => {
    if (!ok) { t.status = prev; renderAll(); }
  });
}
async function closeTask(id) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const { url, token } = CFG;
  const payload = { token, action: 'apply_changes', changes: [{ op: 'delete', id }] };
  try {
    const res  = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    ALL_TASKS = ALL_TASKS.filter(x => x.id !== id);
    renderAll();
  } catch (err) {
    alert('No se pudo archivar la tarea: ' + err.message);
    renderAll();
  }
}
// ── LOAD ──────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('app').innerHTML = '<div class="loading">⏳ Cargando...</div>';
  const { url, token } = CFG;
  try {
    const res  = await fetch(`${url}?token=${encodeURIComponent(token)}&action=get_all`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    ALL_TASKS  = (data.tasks    || []).map(t => ({ ...t, prio: normPrio(t.prio) }));
    CAL_EVENTS = data.calendar  || [];
    document.getElementById('sync-info').textContent =
      `Actualizado: ${new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})} · ${ALL_TASKS.length} tareas · ${CAL_EVENTS.length} eventos`;
    renderAll();
  } catch(err) {
    document.getElementById('app').innerHTML =
      `<div class="err-box">❌ ${esc(err.message)}<br><small>Verificá la URL y el token en ⚙</small></div>`;
    document.getElementById('sync-info').textContent = 'Error al cargar';
  }
}

function fmt(n, dec=0) {
  if (n===null || n===undefined || isNaN(n)) return null;
  return new Intl.NumberFormat('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec}).format(n);
}
// Montos en la moneda base (USD). Negativos entre paréntesis.
function fmtBase(n) {
  if (n===null || n===undefined || isNaN(n)) return '<span class="muted">-</span>';
  const s = 'US$ ' + fmt(Math.round(Math.abs(n)));
  return n < 0 ? `<span class="neg">(${s})</span>` : s;
}
function metricCard(label, valueHtml, sub='', extraClass='') {
  return `<div class="metric-card ${extraClass.includes('hero')?'hero':''}">
    <div class="label">${label}</div>
    <div class="value ${extraClass.replace('hero','').trim()}">${valueHtml}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}
function destroyCajaCharts() {
  Object.values(cajaCharts).forEach(c => { try { c.destroy(); } catch(e) {} });
  cajaCharts = {};
}
async function loadCaja() {
  destroyCajaCharts();
  document.getElementById('caja-app').innerHTML = '<div class="loading">⏳ Cargando caja...</div>';
  const { url, token } = CFG;
  try {
    const res = await fetch(`${url}?token=${encodeURIComponent(token)}&action=get_caja&t=${Date.now()}`);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    cajaLoaded = true;
    renderCaja(d);
  } catch(err) {
    document.getElementById('caja-app').innerHTML =
      `<div class="err-box">❌ No se pudo cargar la caja<br><small>${esc(err.message)}</small><br><small>Verificá que el generador ya haya posteado (set_caja) y que el token sea correcto.</small></div>`;
  }
}
// Paleta de series
const SERIE = { verde:'#1a9d5b', rojo:'#d64545', azul:'#4a78c2', naranja:'#e08e2b', gris:'#9aa0aa' };
const CLRS  = ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#b07aa1','#ff9da7','#9c755f','#bab0ac','#e15759','#7c7c7c'];
// Etiqueta compacta para barras: miles con 1 decimal + "k" ('' si es chico)
function kLbl(v){ if(v===null||v===undefined||isNaN(v)) return ''; if(Math.abs(v)<50) return ''; return (v/1000).toFixed(1)+'k'; }
// ARS en miles, entero (para la tabla de gasto)
function fmtMilesARS(n){ if(n===null||n===undefined||isNaN(n)) return '<span class="muted">-</span>'; return fmt(Math.round(n/1000)); }
function renderCaja(d) {
  const eb  = d.efectivo_bancos || {};

  let html = '';

  // ── Efectivo y Bancos ──
  const sRow   = r => `<tr><td>${esc(r.cuenta)}</td><td>${esc(r.moneda)}</td><td>${fmt(Math.round(r.saldo))}</td><td>${fmtBase(r.valor_usd)}</td></tr>`;
  const subRow = (label,v) => `<tr class="bold"><td>${label}</td><td></td><td></td><td>${fmtBase(v)}</td></tr>`;
  const ef = eb.efectivo || {propias:[],custodia:[]};
  const bk = eb.bancos   || {rows:[]};
  let efBody = (ef.propias||[]).map(sRow).join('') + subRow('Subtotal propias', ef.subtotal_propias||0);
  if ((ef.custodia||[]).length) efBody += (ef.custodia||[]).map(sRow).join('') + subRow('Subtotal custodia', ef.subtotal_custodia||0);
  html += `<div class="section-label">Efectivo</div>
  <div class="caja-card"><table class="caja-table">
    <thead><tr><th>Cuenta</th><th>Mon.</th><th>Saldo</th><th>USD</th></tr></thead>
    <tbody>${efBody}</tbody>
  </table></div>`;
  html += `<div class="section-label">Bancos</div>
  <div class="caja-card"><table class="caja-table">
    <thead><tr><th>Cuenta</th><th>Mon.</th><th>Saldo</th><th>USD</th></tr></thead>
    <tbody>${(bk.rows||[]).map(sRow).join('')}${subRow('Total bancos', bk.total||0)}</tbody>
  </table></div>`;

  // ── Proyección: 2 tablas (mensual/anual) con totales en negrita ──

  const pRow  = (c,o) => `<tr><td>${c}</td><td>${fmtBase((o||{}).mes)}</td><td>${fmtBase((o||{}).anual)}</td></tr>`;

      ${pRow('Ingresos corrientes', Rr.ingresos)}
      ${pRow('Gasto (excl. inversiones)', Rr.gasto)}
      ${pRowB('Resultado', Rr.resultado)}
    </tbody>
  </table></div>
  <div class="caja-card"><table class="caja-table">
    <thead><tr><th>Consumo de cajas USD</th><th>Mensual</th><th>Anual</th></tr></thead>
    <tbody>
      ${pRow('Venta USD (canje)', Cc.venta)}
      ${pRow('Inversiones (desde cajas)', Cc.inv_cajas)}
      ${pRowB('Consumo USD (venta + inv.)', Cc.consumo)}
    </tbody>
  </table></div>`;

  // ── Runway / Liquidez / Consumo (cards) ──
  html += `<div class="metrics-grid">
    ${metricCard('Liquidez (caja+bancos)', fmtBase(pr.liquidez))}
    ${metricCard('Consumo USD mensual', fmtBase(-(pr.consumo_usd_mensual||0)))}
    ${metricCard('Runway', runway!=null ? runway.toFixed(1) + ' meses' : '∞', 'liquidez / consumo', rwCls)}
  </div>`;
  let alerts = '';
  if (runway!=null && runway < 3)      alerts += `<div class="alert danger"><strong>Runway crítico:</strong> ~${runway.toFixed(1)} meses de consumo USD.</div>`;
  else if (runway!=null && runway < 6) alerts += `<div class="alert warning"><strong>Runway bajo:</strong> ~${runway.toFixed(1)} meses de consumo USD.</div>`;
  if (alerts) html += `<div class="caja-alerts">${alerts}</div>`;

  // ── Charts (contenedores) ──
  const uc = d.usd_cash || {}, fl = d.flujo || {}, ir = d.ingresos_rubro || {}, er = d.egresos_rubro || {}, gc = d.gasto_categoria || {};
  if ((uc.meses||[]).length) html += `<div class="section-label">Variación de caja USD (efectivo USD + caja de seguridad)</div><div class="caja-card"><div class="chart-wrap"><canvas id="chUsd"></canvas></div></div>`;

        <tbody>${gc.items.map(it=>`<tr><td>${esc(it.cat)}</td><td>${fmtBase(it.prom)}</td><td>${fmtMilesARS(it.prom_ars)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td><td>${fmtBase(gc.prom_mensual)}</td><td>${fmtMilesARS(gc.prom_mensual_ars)}</td></tr></tfoot>
      </table>
    </div>`;

  document.getElementById('caja-app').innerHTML = html;

  // ════ Render charts (aislado: si Chart.js falla, las tablas ya quedaron arriba) ════
  if (typeof Chart === 'undefined') { console.warn('Chart.js no disponible'); return; }
  try {
  if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);
  const DL_V  = { anchor:'end', align:'end', offset:1, clamp:true, font:{size:8,weight:'600'}, color:'#666', formatter:kLbl };
  const DL_STK= { anchor:'center', align:'center', font:{size:8,weight:'600'}, color:'#fff', formatter:v=>Math.abs(v)>800?(v/1000).toFixed(1)+'k':'' };
  const DL_H  = { anchor:'end', align:'right', offset:2, clamp:true, font:{size:8,weight:'600'}, color:'#555', formatter:kLbl };
  const commonBar = (stacked=false, dl=DL_V) => ({
    responsive:true, maintainAspectRatio:false, layout:{padding:{top:14,right:6}},
    plugins:{ legend:{ position:'bottom', labels:{ font:{size:11}, padding:10, boxWidth:12 } },
              datalabels: dl,
              tooltip:{ callbacks:{ label: ctx => ' ' + (ctx.dataset.label||'') + ': US$ ' + fmt(ctx.raw) } } },
    scales:{ x:{ stacked, grid:{display:false}, ticks:{ font:{size:10}, color:'#aaa' } },
             y:{ stacked, grid:{color:'#f0efeb'}, ticks:{ font:{size:10}, color:'#aaa', callback:v=>'US$ '+fmt(v) } } }
  });

  if ((uc.meses||[]).length) {
    cajaCharts.usd = new Chart(document.getElementById('chUsd'), {
      type:'bar',
      data:{ labels:uc.meses, datasets:[
        {label:'Venta USD',   data:uc.venta_usd,   backgroundColor:SERIE.rojo},
        {label:'Inversiones', data:uc.inversiones, backgroundColor:SERIE.naranja},
        {label:'Total',       data:uc.total,       backgroundColor:SERIE.azul},
      ]},
      options: commonBar(false)
    });
  }
  if ((fl.meses||[]).length) {
    cajaCharts.flujo = new Chart(document.getElementById('chFlujo'), {
      type:'bar',
      data:{ labels:fl.meses, datasets:[
        {label:'Ingresos',   data:fl.ingresos,                    backgroundColor:SERIE.verde},
        {label:'Gastos',     data:(fl.gastos||[]).map(x=>-x),     backgroundColor:SERIE.rojo},
        {label:'Resultado',  data:fl.resultado,                   backgroundColor:SERIE.azul},
        {label:'Inversiones',data:(fl.inversiones||[]).map(x=>-x),backgroundColor:SERIE.naranja},
      ]},
      options: commonBar(false)
    });
  }
  if ((ir.meses||[]).length) {
    const cols = { 'Ingresos Lola':SERIE.verde, 'Ingreso Los Rayos':'#2b8ce0', 'Otros':SERIE.gris };
    cajaCharts.ing = new Chart(document.getElementById('chIng'), {
      type:'bar',
      data:{ labels:ir.meses, datasets:(ir.categorias||[]).map(c=>({label:c, data:ir.series[c], backgroundColor:cols[c]||SERIE.gris})) },
      options: commonBar(true, DL_STK)
    });
  }
  if ((er.meses||[]).length) {
    cajaCharts.egr = new Chart(document.getElementById('chEgr'), {
      type:'bar',
      data:{ labels:er.meses, datasets:(er.categorias||[]).map((c,i)=>({label:c, data:er.series[c], backgroundColor:CLRS[i%CLRS.length]})) },
      options: commonBar(true, DL_STK)
    });
  }
  if ((gc.items||[]).length) {
    cajaCharts.gasto = new Chart(document.getElementById('chGasto'), {
      type:'bar',
      data:{ labels: gc.items.map(it=>it.cat), datasets:[{ label:'Prom/mes', data: gc.items.map(it=>Math.round(it.prom)), backgroundColor:SERIE.azul, borderRadius:3 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{padding:{right:34}},
        plugins:{ legend:{display:false}, datalabels: DL_H,
                  tooltip:{ callbacks:{ label: ctx=>' US$ '+fmt(ctx.raw) } } },
        scales:{ x:{ grid:{color:'#f0efeb'}, ticks:{ font:{size:10}, color:'#aaa', callback:v=>'US$ '+fmt(v) } },
                 y:{ grid:{display:false}, ticks:{ font:{size:10}, color:'#555', autoSkip:false } } } }
    });
  }
  } catch(e) { console.warn('charts:', e); }
}
// ── STARTUP ───────────────────────────────────────────────────
if (loadConfig()) {
  document.getElementById('main').style.display  = 'block';
  loadData();
} else {
  document.getElementById('setup').style.display = 'flex';
}
</script>
</body>
</html>
