<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Santiago</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg:        #17171a;
  --surface:   #1f1f23;
  --surface-2: #27272c;
  --surface-3: #303036;
  --border:    #35353c;
  --border-soft:#2a2a2f;
  --text:      #ededee;
  --text-2:    #c7c7ca;
  --muted:     #9a9aa0;
  --muted-2:   #7a7a80;
  --accent:    #d9a441;
  --accent-2:  #e8bd6a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  padding: 16px; font-size: 14px; min-height: 100vh;
}
/* ── SETUP SCREEN ── */
.setup-overlay {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.setup-card {
  background: var(--surface); border-radius: 16px; padding: 32px;
  max-width: 440px; width: 100%; border: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,.4);
}
.setup-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.setup-card p  { font-size: 12px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
.setup-card label { display: block; font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.setup-card input {
  width: 100%; padding: 9px 12px; border-radius: 8px;
  border: 1.5px solid var(--border); font-size: 12px; font-family: monospace;
  margin-bottom: 14px; outline: none; transition: border-color .15s;
  background: var(--surface-2); color: var(--text);
}
.setup-card input:focus { border-color: var(--accent); }
.setup-btn {
  width: 100%; padding: 11px; background: var(--accent); color: #12122a;
  border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.setup-btn:hover { background: var(--accent-2); }
.setup-err { color: #fca5a5; font-size: 11px; margin-top: 8px; display: none; }
/* ── HEADER ── */
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.header h1 { font-size: 18px; font-weight: 800; }
.header-right { text-align: right; }
.sync-info { font-size: 10px; color: var(--muted-2); line-height: 1.7; }
.btn-sm {
  font-size: 24px; font-weight: 700; padding: 10px 20px;
  border-radius: 20px; border: 2px solid var(--border);
  background: var(--surface); color: var(--muted); cursor: pointer; margin-left: 8px;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.date-sub { font-size: 11px; color: var(--muted-2); margin-top: 3px; text-transform: capitalize; }
/* ── STATS ── */
.stats { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.stat { background: var(--surface); border-radius: 10px; padding: 10px 14px; border: 1px solid var(--border-soft); flex: 1; min-width: 70px; text-align: center; }
.stat-val { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1; }
.stat-lbl { font-size: 9px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.s-hoy    .stat-val { color: #f0b64d; }
.s-semana .stat-val { color: #3fc5df; }
.s-crit   .stat-val { color: #f08a8a; }
.s-venc   .stat-val { color: #b48bff; }
/* ── SECTIONS ── */
.section { margin-bottom: 20px; }
.section-title {
  display: flex; align-items: center; gap: 7px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: var(--accent);
  margin-bottom: 8px; padding-bottom: 6px;
  border-bottom: 1.5px solid var(--border);
}
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.badge { background: var(--surface-3); color: var(--text-2); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
/* ── FILTERS ── */
.filter-bar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.fbtn {
  font-size: 18px; font-weight: 600; padding: 10px 20px;
  border-radius: 20px; border: 2px solid var(--border);
  background: var(--surface); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: all .12s;
}
.fbtn:hover  { border-color: var(--accent); color: var(--accent); }
.fbtn.active { background: var(--accent); border-color: var(--accent); color: #12122a; }
.fcat-dot { width: 6px; height: 6px; border-radius: 50%; }
/* ── TASK CARDS ── */
.tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px; }
.task-card {
  background: var(--surface); border-radius: 8px; padding: 10px 12px;
  border-left: 3px solid var(--border); border-top: 1px solid var(--border-soft);
  border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft);
}
.p-critica { border-left-color: #ef4444; }
.p-alta    { border-left-color: #f97316; }
.p-media   { border-left-color: #eab308; }
.p-baja    { border-left-color: #22c55e; }
.is-hoy    { background: rgba(240,182,77,.10); }
.is-venc   { border-left-color: #b48bff; }
.task-top  { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.task-desc { font-size: 12.5px; font-weight: 500; color: var(--text); line-height: 1.45; }
.task-controls { display: flex; gap: 2px; flex-shrink: 0; }
.toggle-btn {
  background: none; border: none; font-size: 16px; line-height: 1;
  padding: 2px 3px; cursor: pointer; opacity: .45;
  transition: opacity .12s, transform .12s;
}
.toggle-btn:hover  { opacity: 1; transform: scale(1.18); }
.toggle-btn.active { opacity: 1; }
.task-meta { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
.tag-cat    { background: var(--surface-2); color: var(--text-2); }
.tag-status { background: var(--surface-2); color: var(--text-2); }
.tag-venc   { background: rgba(234,88,12,.18); color: #fdba74; font-weight: 700; }
.tag-venc.urgent { background: rgba(220,38,38,.20); color: #fca5a5; }
.tag-terc   { background: rgba(37,99,235,.20); color: #93c5fd; }
.tag-id     { background: var(--surface-2); color: var(--muted-2); font-size: 9px; }
.tag-select {
  font-size: 10px; font-weight: 500; padding: 2px 6px 2px 7px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
  cursor: pointer; outline: none; max-width: 140px;
}
.tag-select:hover  { border-color: var(--accent); }
.tag-select:focus  { border-color: var(--accent); }
.tag-select option { background: var(--surface); color: var(--text); }
/* ── QUICK ADD ── */
.quick-add { display: flex; gap: 6px; background: var(--surface); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--border-soft); flex-wrap: wrap; }
.quick-add input[type=text] { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 13px; outline: none; font-family: inherit; background: var(--surface-2); color: var(--text); }
.quick-add input[type=text]:focus { border-color: var(--accent); }
.quick-add select { padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 12px; background: var(--surface-2); color: var(--text-2); outline: none; font-family: inherit; }
.quick-add input[type=date] { padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 12px; color: var(--text-2); outline: none; font-family: inherit; background: var(--surface-2); }
.quick-add button { padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent); color: #12122a; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.quick-add button:hover    { background: var(--accent-2); }
.quick-add button:disabled { background: var(--surface-3); color: var(--muted); cursor: default; }
/* ── EDIT PANEL ── */
.edit-panel { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.edit-panel input, .edit-panel select, .edit-panel textarea {
  width: 100%; padding: 7px 9px; border-radius: 7px; border: 1.5px solid var(--border);
  font-size: 12px; font-family: inherit; outline: none; color: var(--text); background: var(--surface-2);
}
.edit-panel input:focus, .edit-panel select:focus, .edit-panel textarea:focus { border-color: var(--accent); }
.edit-panel textarea { resize: vertical; min-height: 44px; }
.edit-row { display: flex; gap: 6px; }
.edit-row > * { flex: 1; }
/* ── CALENDAR ── */
.cal-day { margin-bottom: 12px; }
.cal-day-header { font-size: 10px; font-weight: 800; color: var(--accent-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.cal-event { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 8px; padding: 8px 12px; margin-bottom: 4px; border-left: 3px solid var(--accent); border-top: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
.cal-time   { font-size: 11px; font-weight: 700; color: var(--accent-2); min-width: 46px; flex-shrink: 0; }
.cal-allday { font-size: 10px; color: var(--muted); font-style: italic; min-width: 46px; flex-shrink: 0; }
.cal-title  { font-size: 12.5px; color: var(--text); }
/* ── TABS ── */
.tab-bar {
  display: flex; gap: 4px; margin-bottom: 16px;
  background: var(--surface-2); border-radius: 10px; padding: 4px;
}
.tab-btn {
  flex: 1; padding: 9px 12px; border: none; border-radius: 7px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: transparent; color: var(--muted); transition: all .15s;
}
.tab-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.tab-btn:hover:not(.active) { color: var(--text-2); }
/* ── CAJA STYLES ── */
.metrics-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 16px;
}
@media (max-width: 480px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } }
.metric-card { background: var(--surface); border-radius: 10px; border: 1px solid var(--border-soft); padding: 14px 16px; }
.metric-card .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
.metric-card .value { font-size: 20px; font-weight: 600; line-height: 1.1; color: var(--text); }
.metric-card .sub { font-size: 10px; color: var(--muted-2); margin-top: 4px; }
.metric-card.placeholder { background: transparent; border: none; }
.metric-card.hero { grid-column: 1 / -1; background: linear-gradient(135deg,#242452,#1a1a38); border: 1px solid var(--accent); }
.metric-card.hero .label { color: var(--accent-2); }
.metric-card.hero .value { color: #fff; font-size: 26px; }
.metric-card.hero .sub { color: var(--text-2); }
.value.red   { color: #f08a8a; }
.value.amber { color: #e0b04a; }
.value.green { color: #5fd39a; }
.caja-card { background: var(--surface); border-radius: 10px; border: 1px solid var(--border-soft); padding: 16px; margin-bottom: 16px; }
.balance-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
@media (max-width: 560px) { .balance-cols { grid-template-columns: 1fr; } }
.pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
@media (max-width: 900px) { .pair-grid { grid-template-columns: 1fr; } }
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-bottom: 4px; }
@media (max-width: 900px) { .res-grid { grid-template-columns: 1fr; } }
.bj-group { margin-bottom: 10px; }
.bj-h { font-size: 11px; font-weight: 700; color: var(--text-2); margin: 4px 0 6px; }
.bj-item { display: block; padding: 7px 10px; border-radius: 7px; background: var(--surface-2); margin-bottom: 5px; text-decoration: none; color: var(--text-2); font-size: 12px; line-height: 1.4; border-left: 3px solid var(--accent); }
.bj-item:hover { background: var(--surface-3); }
.bj-from { font-weight: 600; color: var(--text); }
.bj-date { color: var(--muted-2); font-size: 11px; }
.tesis-box { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
.tesis-ul { margin: 4px 0 0 16px; padding: 0; }
.tesis-ul li { font-size: 12.5px; color: var(--text); line-height: 1.5; margin-bottom: 5px; }
.pair-cell { text-align: center; min-width: 0; }
.tbl-wrap { display: inline-block; max-width: 100%; overflow-x: auto; text-align: left; vertical-align: top; }
.ct-title { font-weight: 600; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.caja-card.hug { width: fit-content; max-width: 100%; margin-left: auto; margin-right: auto; text-align: center; }
.cap { width: 0; min-width: 100%; }
.kpi-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; justify-content: center; }
.kpi-row .metric-card { flex: 0 1 auto; min-width: 140px; text-align: center; }
.caja-table { width: auto; border-collapse: collapse; font-size: 13px; }
.caja-table th, .caja-table td { padding-left: 24px; }
.caja-table th:first-child, .caja-table td:first-child { padding-left: 0; }
.caja-table thead th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding-top: 0; padding-bottom: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.caja-table thead th:first-child { text-align: left; }
.caja-table tbody tr { border-bottom: 1px solid var(--border-soft); }
.caja-table tbody tr:last-child { border-bottom: none; }
.caja-table tbody td { padding-top: 7px; padding-bottom: 7px; text-align: right; color: var(--text-2); white-space: nowrap; }
.caja-table tbody td:first-child { text-align: left; color: var(--text-2); }
.caja-table tbody tr.bold td { font-weight: 700; color: var(--text); border-top: 1px solid var(--border); }
.caja-table tfoot td { padding-top: 9px; padding-bottom: 0; font-weight: 600; text-align: right; border-top: 1px solid var(--border); color: var(--text); white-space: nowrap; }
.caja-table tfoot td:first-child { text-align: left; }
.neg { color: #f08a8a; }
.pos { color: #5fd39a; }
.muted { color: var(--muted-2); }
.chart-wrap { position: relative; height: 220px; margin-top: 12px; }
.chart-wrap.tall { height: 300px; }
.chart-wrap.res { height: 340px; max-width: 600px; }
.fc-fallback { background: rgba(224,176,74,.16); }
.caja-alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.alert { border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.5; }
.alert.danger  { background: rgba(200,50,50,.14); color: #fca5a5; border: 1px solid rgba(200,50,50,.35); }
.alert.warning { background: rgba(217,150,40,.14); color: #f0c674; border: 1px solid rgba(217,150,40,.35); }
.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1.5px solid var(--border); }
.caja-meta { font-size: 11px; color: var(--muted-2); margin-bottom: 16px; }
/* ── STATES ── */
.empty   { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 0; }
.loading { text-align: center; color: var(--muted); padding: 50px 0; font-size: 13px; }
.err-box { background: rgba(220,38,38,.12); color: #fca5a5; border: 1px solid rgba(220,38,38,.3); border-radius: 8px; padding: 12px; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<!-- Setup screen -->
<div class="setup-overlay" id="setup" style="display:none">
  <div class="setup-card">
    <h2>📊 Dashboard — Configuración</h2>
    <p>Primera vez o nueva configuración. Ingresá la URL y el token del Apps Script para conectar con tus tareas.</p>
    <label>URL del Apps Script</label>
    <input id="cfg-url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Token secreto</label>
    <input id="cfg-token" type="password" placeholder="Tu token">
    <button class="setup-btn" onclick="saveConfig()">Conectar</button>
    <div class="setup-err" id="cfg-err"></div>
  </div>
</div>
<!-- Main -->
<div id="main" style="display:none">
  <div class="header">
    <div>
      <h1>📊 Dashboard</h1>
      <div class="date-sub" id="date-line"></div>
    </div>
    <div class="header-right">
      <div class="sync-info" id="sync-info">Cargando...</div>
      <button class="btn-sm" onclick="refreshActive()" title="Actualizar">↻</button>
      <button class="btn-sm" onclick="showSetup()" title="Cambiar configuración">⚙</button>
    </div>
  </div>
  <!-- Tabs -->
  <div class="tab-bar">
    <button id="tab-resumen"    class="tab-btn"        onclick="switchTab('resumen')">🏠 Resumen</button>
    <button id="tab-pendientes" class="tab-btn active" onclick="switchTab('pendientes')">📋 Pendientes</button>
    <button id="tab-caja"       class="tab-btn"        onclick="switchTab('caja')">💰 Caja</button>
    <button id="tab-forecast"   class="tab-btn"        onclick="switchTab('forecast')">📆 Forecast</button>
  </div>
  <!-- Resumen view -->
  <div id="view-resumen" style="display:none">
    <div id="resumen-app"><div class="loading">⏳ Cargando resumen...</div></div>
  </div>
  <!-- Pendientes view -->
  <div id="view-pendientes">
    <div id="app"><div class="loading">⏳ Cargando...</div></div>
  </div>
  <!-- Caja view -->
  <div id="view-caja" style="display:none">
    <div id="caja-app"><div class="loading">⏳ Cargando caja...</div></div>
  </div>
  <!-- Forecast view -->
  <div id="view-forecast" style="display:none">
    <div id="forecast-app"><div class="loading">⏳ Cargando forecast...</div></div>
  </div>
</div>
<script>
// ── CONFIG ────────────────────────────────────────────────────
const CFG_KEY = 'pendientes_cfg';
let CFG = null;
let activeTab = 'pendientes';
let cajaLoaded = false;
let forecastLoaded = false;
let resumenLoaded = false;
let pendientesLoaded = false;
let RESUMEN_CAJA = {};
let RESUMEN_BANDEJA = {};
let cajaCharts = {};
function loadConfig() {
  try { CFG = JSON.parse(localStorage.getItem(CFG_KEY)); } catch(e) { CFG = null; }
  return CFG && CFG.url && CFG.token;
}
function saveConfig() {
  const url   = document.getElementById('cfg-url').value.trim();
  const token = document.getElementById('cfg-token').value.trim();
  const err   = document.getElementById('cfg-err');
  if (!url || !token) { err.textContent = 'Completá ambos campos.'; err.style.display='block'; return; }
  CFG = { url, token };
  localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
  err.style.display = 'none';
  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display  = 'block';
  switchTab('resumen');
}
function showSetup() {
  if (CFG) {
    document.getElementById('cfg-url').value   = CFG.url;
    document.getElementById('cfg-token').value = CFG.token;
  }
  document.getElementById('main').style.display  = 'none';
  document.getElementById('setup').style.display = 'flex';
}
// ── TABS ──────────────────────────────────────────────────────
const TABS = ['resumen','pendientes','caja','forecast'];
function switchTab(tab) {
  activeTab = tab;
  TABS.forEach(t => {
    const b = document.getElementById('tab-' + t);
    const v = document.getElementById('view-' + t);
    if (b) b.className = 'tab-btn' + (t === tab ? ' active' : '');
    if (v) v.style.display = (t === tab) ? 'block' : 'none';
  });
  if (tab === 'caja'     && !cajaLoaded)     loadCaja();
  if (tab === 'forecast' && !forecastLoaded) loadForecast();
  if (tab === 'resumen'  && !resumenLoaded)  loadResumen();
  if (tab === 'pendientes' && !pendientesLoaded) loadData();
}
function refreshActive() {
  if (activeTab === 'pendientes') {
    loadData();
  } else if (activeTab === 'caja') {
    cajaLoaded = false; loadCaja();
  } else if (activeTab === 'forecast') {
    forecastLoaded = false; loadForecast();
  } else if (activeTab === 'resumen') {
    resumenLoaded = false; loadResumen();
  }
}
// ── STUBS (se completan en B3/B5) ──────────────────────────────
function rerender() { renderAll(); if (resumenLoaded) renderResumen(RESUMEN_CAJA); }
async function loadResumen() {
  document.getElementById('resumen-app').innerHTML = '<div class="loading">⏳ Cargando resumen...</div>';
  const { url, token } = CFG;
  try {
    const [ra, rc, rb] = await Promise.all([
      fetch(`${url}?token=${encodeURIComponent(token)}&action=get_all`).then(r => r.json()),
      fetch(`${url}?token=${encodeURIComponent(token)}&action=get_caja&t=${Date.now()}`).then(r => r.json()).catch(() => ({})),
      fetch(`${url}?token=${encodeURIComponent(token)}&action=get_bandeja&t=${Date.now()}`).then(r => r.json()).catch(() => ({}))
    ]);

    const flujo = `<tr class="bold"><td>Flujo del día</td>${(fc.flujo || []).map(v => `<td>${arsCell(v)}</td>`).join('')}</tr>`;
    const saldo = `<tr class="bold"><td>Saldo proyectado</td>${(fc.saldo || []).map(v => `<td><span class="${v < cmin ? 'neg' : ''}">${fmt(Math.round(v))}</span></td>`).join('')}</tr>`;
    html += `<div class="caja-card hug"><div class="tbl-wrap"><table class="caja-table"><thead><tr>${head}</tr></thead><tbody>${body}${flujo}${saldo}</tbody></table></div>
      <div class="cap" style="font-size:11px;color:var(--muted-2);margin-top:10px;line-height:1.5">Montos en ARS. Las celdas <span style="background:rgba(224,176,74,.16);padding:0 5px;border-radius:3px">ámbar</span> usan un valor estimado (promedio de los últimos 3 meses) por falta de dato del vencimiento. Saldo en rojo = por debajo de la caja mínima.</div></div>`;
  }

  // ───── LARGO PLAZO (USD, 18m) ─────
  html += `<div class="section-label" style="margin-top:8px">Forecast de caja — largo plazo (USD, 18 meses)</div>`;
  if (fl.error || !(fl.meses || []).length) {
    html += `<div class="caja-card"><div class="empty">Forecast de largo plazo no disponible.${fl.error ? ' (' + esc(fl.error) + ')' : ''}</div></div>`;
  } else {
    const rw = fl.runway_meses;
    const rwCls = (rw == null) ? 'green' : (rw < 3 ? 'red' : rw < 6 ? 'amber' : 'green');
    html += `<div class="kpi-row">
      ${metricCard('Liquidez (caja USD)', fmtBase(fl.liquidez))}
      ${metricCard('Consumo corriente USD/mes', fmtBase(fl.consumo_corriente_mes))}
      ${metricCard('Aportes inversión /mes (próx 6m)', fmtBase(fl.aportes_mes_6m))}
      ${metricCard('Retornos inversión /mes (próx 6m)', fmtBase(fl.retornos_mes_6m))}
      ${metricCard('Runway', rw == null ? '&gt; 18 meses' : rw.toFixed(1) + ' meses', '', rwCls)}
    </div>`;
    if (rw != null && rw < 6) {
      const cls = rw < 3 ? 'danger' : 'warning';
      html += `<div class="caja-alerts"><div class="alert ${cls}"><strong>Runway ${rw < 3 ? 'crítico' : 'bajo'}:</strong> ~${rw.toFixed(1)} meses antes de que el saldo proyectado cruce 0.</div></div>`;
    }
    const m6 = fl.meses6 || [], mat = fl.matriz || [];
    if (m6.length && mat.length) {
      const head = `<th>Concepto</th>` + m6.map(m => `<th>${esc(m)}</th>`).join('');
      const bodyM = mat.map(r => `<tr class="${r.bold ? 'bold' : ''}"><td>${esc(r.name)}</td>${(r.vals||[]).map(v => `<td>${Math.abs(v) < 0.5 ? '<span class="muted">—</span>' : fmtBase(v)}</td>`).join('')}</tr>`).join('');

        <div class="cap" style="font-size:11px;color:var(--muted-2);margin-top:10px;line-height:1.5">Forecast de caja USD — próximos 6 meses (saldo inicial → flujos → saldo final). Runway = mes en que el saldo proyectado cruza 0. La proyección completa se edita en el Tracker → 📆 Forecast → Forecast anual.</div></div>`;
    } else {
      html += `<div class="caja-card"><div class="empty">Matriz de proyección no disponible (regenerá el feed).</div></div>`;
    }
  }

  document.getElementById('forecast-app').innerHTML = html;
}
async function loadForecast() {
  document.getElementById('forecast-app').innerHTML = '<div class="loading">⏳ Cargando forecast...</div>';
  const { url, token } = CFG;
  try {
    const res = await fetch(`${url}?token=${encodeURIComponent(token)}&action=get_caja&t=${Date.now()}`);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    forecastLoaded = true;
    renderForecast(d);
  } catch (err) {
    document.getElementById('forecast-app').innerHTML =
      `<div class="err-box">❌ No se pudo cargar el forecast<br><small>${esc(err.message)}</small></div>`;
  }
}

const CAT_COLORS = {

document.getElementById('date-line').textContent =
  new Date().toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
// ── NORMALIZE ─────────────────────────────────────────────────
function normPrio(r) {
  if (!r) return '';
  if (r.includes('rítica') || r.includes('ritica')) return '🔴 Crítica';
  if (r.includes('Alta'))   return '🟠 Alta';
  if (r.includes('Media'))  return '🟡 Media';
  if (r.includes('Baja'))   return '🟢 Baja';
  return r;
}
function normStatus(r) {
  if (!r) return '';
  if (r.includes('Terminado'))   return '✅ Terminado';
  if (r.includes('Comenzado'))   return '🔄 Comenzado';
  if (r.includes('Seguimiento')) return '👁 Seguimiento';
  if (r.includes('Largo'))       return '📌 Largo Plazo';
  if (r.includes('Nuevo'))       return '🆕 Nuevo';
  return r;
}
// ── DATE UTILS ────────────────────────────────────────────────
function daysFrom(dateStr) {
  if (!dateStr) return null;
  const [y,m,d] = dateStr.slice(0,10).split('-').map(Number);
  const target = new Date(y, m-1, d);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target - now) / 864e5);
}
function labelDays(diff) {
  if (diff === null) return '';
  if (diff === 0)  return 'Hoy';
  if (diff === 1)  return 'Mañana';
  if (diff < 0)   return `Vencida hace ${Math.abs(diff)}d`;
  return `en ${diff}d`;
}
function dayLabel(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt   = new Date(y, m-1, d);
  const now  = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((dt - now) / 864e5);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Mañana';
  return dt.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'short'});
}
// ── RENDER ────────────────────────────────────────────────────
function prioCls(p) {
  if (!p) return '';
  if (p.includes('rítica')) return 'p-critica';
  if (p.includes('Alta'))   return 'p-alta';
  if (p.includes('Media'))  return 'p-media';
  if (p.includes('Baja'))   return 'p-baja';
  return '';
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function prioSelect(t) {

async function postChange(id, fields) {
  const { url, token } = CFG;
  const payload = { token, action: 'apply_changes', changes: [{ op: 'update', id, fields }] };
  try {
    const res  = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return true;
  } catch (err) {
    alert('No se pudo guardar el cambio: ' + err.message);
    return false;
  }
}
function toggleHoy(id) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  if (t.hoy !== '⭐' && t.semana !== '✅') {
    alert('Esta tarea no está en el radar de la semana. Agregala primero con 📑 antes de marcarla para hoy.');
    return;
  }
  const prevHoy = t.hoy;
  const newVal  = prevHoy === '⭐' ? '☆' : '⭐';
  t.hoy = newVal; // optimista
  rerender();
  postChange(id, { hoy: newVal }).then(ok => {
    if (!ok) { t.hoy = prevHoy; rerender(); }
  });
}
function toggleSemana(id) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const prevSemana = t.semana, prevHoy = t.hoy;
  const newVal = prevSemana === '✅' ? '—' : '✅';
  t.semana = newVal;
  if (newVal !== '✅') t.hoy = '☆';
  rerender();
  postChange(id, { semana: newVal }).then(ok => {
    if (!ok) { t.semana = prevSemana; t.hoy = prevHoy; rerender(); }
  });
}
function changePrio(id, val) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const prev = t.prio;
  t.prio = val; // optimista
  rerender();
  postChange(id, { prio: val }).then(ok => {
    if (!ok) { t.prio = prev; rerender(); }
  });
}
function toggleEdit(id) {
  editingId = (editingId === id) ? null : id;
  rerender();
}
function saveField(id, field, value) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const prev = t[field];
  if (prev === value) return;
  t[field] = value; // optimista
  rerender();
  postChange(id, { [field]: value }).then(ok => {
    if (!ok) { t[field] = prev; rerender(); }
  });
}
async function postAdd(fields) {
  const { url, token } = CFG;
  const payload = { token, action: 'apply_changes', changes: [{ op: 'add', fields }] };
  try {
    const res  = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return true;
  } catch (err) {
    alert('No se pudo crear la tarea: ' + err.message);
    return false;
  }
}
async function quickAdd() {
  const descEl = document.getElementById('qa-desc');
  const desc   = descEl.value.trim();
  if (!desc) { descEl.focus(); return; }
  const cat  = document.getElementById('qa-cat').value;
  const prio = document.getElementById('qa-prio').value;
  const venc = document.getElementById('qa-venc').value;
  const btn  = document.getElementById('qa-btn');
  const fields = { desc, cat, prio, semana: '✅', hoy: '⭐' };
  if (venc) fields.venc = venc;
  btn.disabled = true; btn.textContent = 'Agregando...';
  const ok = await postAdd(fields);
  if (ok) {
    await loadData();
  } else {
    btn.disabled = false; btn.textContent = '+ Agregar';
  }
}
function changeStatus(id, val) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  if (val === '✅ Terminado') {
    if (!confirm(`¿Marcar "${t.desc}" como Terminado?\n\nSe archivará y dejará de aparecer en Pendientes.`)) {
      rerender();
      return;
    }
    closeTask(id);
    return;
  }
  const prev = t.status;
  t.status = val; // optimista
  rerender();
  postChange(id, { status: val }).then(ok => {
    if (!ok) { t.status = prev; rerender(); }
  });
}
async function closeTask(id) {
  const t = ALL_TASKS.find(x => x.id === id);
  if (!t) return;
  const { url, token } = CFG;
  const payload = { token, action: 'apply_changes', changes: [{ op: 'delete', id }] };
  try {
    const res  = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    ALL_TASKS = ALL_TASKS.filter(x => x.id !== id);
    rerender();
  } catch (err) {
    alert('No se pudo archivar la tarea: ' + err.message);
    rerender();
  }
}

function fmt(n, dec=0) {
  if (n===null || n===undefined || isNaN(n)) return null;
  return new Intl.NumberFormat('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec}).format(n);
}
// Montos en la moneda base (USD). Negativos entre paréntesis.
function fmtBase(n) {
  if (n===null || n===undefined || isNaN(n)) return '<span class="muted">-</span>';
  const s = 'US$ ' + fmt(Math.round(Math.abs(n)));
  return n < 0 ? `<span class="neg">(${s})</span>` : s;
}

}

  document.getElementById('caja-app').innerHTML = html;

  // ════ Render charts (aislado: si Chart.js falla, las tablas ya quedaron arriba) ════
  if (typeof Chart === 'undefined') { console.warn('Chart.js no disponible'); return; }
  try {
  if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);
  const DL_V  = { anchor:'end', align:'end', offset:1, clamp:true, font:{size:8,weight:'600'}, color:'#b0b0b5', formatter:kLbl };
  const DL_STK= { anchor:'center', align:'center', font:{size:8,weight:'600'}, color:'#fff', formatter:v=>Math.abs(v)>800?(v/1000).toFixed(1)+'k':'' };
  const DL_H  = { anchor:'end', align:'right', offset:2, clamp:true, font:{size:8,weight:'600'}, color:'#c7c7ca', formatter:kLbl };
  const commonBar = (stacked=false, dl=DL_V) => ({
    responsive:true, maintainAspectRatio:false, layout:{padding:{top:14,right:6}},
    plugins:{ legend:{ position:'bottom', labels:{ font:{size:11}, padding:10, boxWidth:12 } },
              datalabels: dl,
              tooltip:{ callbacks:{ label: ctx => ' ' + (ctx.dataset.label||'') + ': US$ ' + fmt(ctx.raw) } } },
    scales:{ x:{ stacked, grid:{display:false}, ticks:{ font:{size:10}, color:'#9a9aa0' } },
             y:{ stacked, grid:{color:'rgba(255,255,255,.06)'}, ticks:{ font:{size:10}, color:'#9a9aa0', callback:v=>'US$ '+fmt(v) } } }
  });

  // marcador de neto/total (rombo blanco), no se apila (stack propio)
  const NETDS = (data) => ({ label:'Δ neto', data, type:'line', showLine:false, stack:'net',
      pointStyle:'rectRot', pointRadius:6, pointHoverRadius:7,
      pointBackgroundColor:'#e8e9f3', pointBorderColor:'#0e0e1a', pointBorderWidth:1.5,
      datalabels:{ anchor:'end', align:'top', offset:2, color:'#e8e9f3', font:{size:9,weight:'700'}, formatter:kLbl } });

  // fuera de escala: acota el eje al 2º mes más extremo y etiqueta en ámbar lo que se corta
  const capInfo = (meses, series, keys, net) => {
    const posv = meses.map((_,i)=> keys.reduce((s,k)=>{const v=(series[k]||[])[i]||0; return s+(v>0?v:0);},0));
    const negv = meses.map((_,i)=> keys.reduce((s,k)=>{const v=(series[k]||[])[i]||0; return s+(v<0?v:0);},0));
    const permes = meses.map((_,i)=> Math.max(Math.abs(posv[i]),Math.abs(negv[i]),Math.abs(net[i]||0)));
    const s = permes.filter(x=>x>0).sort((a,b)=>b-a);
    let cap = s.length>1 ? s[1] : (s[0]||1000); cap = Math.max(cap,1000)*1.12;
    return {posv, negv, HI:cap, LO:-cap};
  };
  const oosPlugin = (meses, posv, negv, net, HI, LO) => ({ id:'oos',
    afterDatasetsDraw(chart){
      const {ctx, chartArea:{top,bottom}, scales:{x}} = chart;
      ctx.save(); ctx.textAlign='center'; ctx.font='700 9px system-ui,-apple-system,sans-serif';
      meses.forEach((m,i)=>{ const cx=x.getPixelForValue(i);
        if(posv[i]>HI){ ctx.fillStyle='#e0b04a'; ctx.fillText('▲ '+fmt(Math.round(posv[i])), cx, top+9); }
        if(negv[i]<LO){ ctx.fillStyle='#e0b04a'; ctx.fillText('▼ '+fmt(Math.round(negv[i])), cx, bottom-3); }
        const nv=net[i]; if(nv>HI||nv<LO){ ctx.fillStyle='#e8e9f3'; ctx.fillText('Δ '+fmt(Math.round(nv)), cx, nv>HI?top+20:bottom-13); }
      });
      ctx.restore();
    }});

  // (charts chUsd / chInv retirados en B2 — quedan sus tablas arriba)
  if ((fl.meses||[]).length) {
    cajaCharts.flujo = new Chart(document.getElementById('chFlujo'), {
      type:'bar',
      data:{ labels:fl.meses, datasets:[
        {label:'Ingresos',   data:fl.ingresos,                backgroundColor:SERIE.verde},
        {label:'Gastos',     data:(fl.gastos||[]).map(x=>-x), backgroundColor:SERIE.rojo},
        {label:'Resultado',  data:fl.resultado,               backgroundColor:SERIE.azul},
      ]},
      options: commonBar(false)
    });
  }
  if ((ir.meses||[]).length) {
    const cols = { 'Ingresos Lola':SERIE.verde, 'Ingreso Los Rayos':'#2b8ce0',
                   'Retribución sueldo Conceptual SS':'#d55181', 'Otros':SERIE.gris };
    cajaCharts.ing = new Chart(document.getElementById('chIng'), {
      type:'bar',
      data:{ labels:ir.meses, datasets:(ir.categorias||[]).map(c=>({label:c, data:ir.series[c], backgroundColor:cols[c]||SERIE.gris})) },
      options: commonBar(true, DL_STK)
    });
  }
  if ((er.meses||[]).length) {
    cajaCharts.egr = new Chart(document.getElementById('chEgr'), {
      type:'bar',
      data:{ labels:er.meses, datasets:(er.categorias||[]).map((c,i)=>({label:c, data:er.series[c], backgroundColor:CLRS[i%CLRS.length]})) },
      options: commonBar(true, DL_STK)
    });
  }
  if ((gc.items||[]).length) {
    cajaCharts.gasto = new Chart(document.getElementById('chGasto'), {
      type:'bar',
      data:{ labels: gc.items.map(it=>it.cat), datasets:[{ label:'Prom/mes', data: gc.items.map(it=>Math.round(it.prom)), backgroundColor:SERIE.azul, borderRadius:3 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{padding:{right:34}},
        plugins:{ legend:{display:false}, datalabels: DL_H,
                  tooltip:{ callbacks:{ label: ctx=>' US$ '+fmt(ctx.raw) } } },
        scales:{ x:{ grid:{color:'rgba(255,255,255,.06)'}, ticks:{ font:{size:10}, color:'#9a9aa0', callback:v=>'US$ '+fmt(v) } },
                 y:{ grid:{display:false}, ticks:{ font:{size:10}, color:'#c7c7ca', autoSkip:false } } } }
    });
  }
  } catch(e) { console.warn('charts:', e); }
}
// ── STARTUP ───────────────────────────────────────────────────
if (loadConfig()) {
  document.getElementById('main').style.display  = 'block';
  switchTab('resumen');
} else {
  document.getElementById('setup').style.display = 'flex';
}
</script>
</body>
